<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RELICA Roadmap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.7;
            color: #F5F5F5;
            background: #0A0E12;
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            background: linear-gradient(135deg, #0A0E12 0%, #1A1F26 100%);
            color: #F5F5F5;
            padding: 80px 20px;
            text-align: center;
            margin-bottom: 60px;
            border-radius: 0;
            border-bottom: 1px solid #2D3748;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 217, 255, 0.03) 2px,
                rgba(0, 217, 255, 0.03) 4px
            );
            pointer-events: none;
            opacity: 0.4;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(to right, transparent, #00D9FF, transparent);
            opacity: 0.4;
        }

        header h1 {
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: 4em;
            margin-bottom: 15px;
            color: #00D9FF;
            text-shadow: 0 0 40px rgba(0, 217, 255, 0.6);
            letter-spacing: -0.02em;
            position: relative;
            z-index: 1;
        }

        header p {
            font-family: 'Inter', sans-serif;
            font-size: 1.3em;
            opacity: 0.8;
            position: relative;
            z-index: 1;
        }

        .version-info {
            background: #1A1F26;
            padding: 20px 30px;
            border-radius: 8px;
            margin-bottom: 40px;
            border: 1px solid #2D3748;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.9em;
        }

        .version-info a {
            color: #00D9FF;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .version-info a:hover {
            color: #FFB800;
        }

        .timeline {
            position: relative;
            padding-left: 50px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, #00D9FF 0%, #2D3748 100%);
        }

        .quarter {
            margin-bottom: 60px;
        }

        .quarter-header {
            background: #1A1F26;
            padding: 25px 35px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #2D3748;
            position: relative;
            transition: border-color 0.3s;
        }

        .quarter-header:hover {
            border-color: #00D9FF;
        }

        .quarter-header::before {
            content: '';
            position: absolute;
            left: -57px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background: #00D9FF;
            border: 3px solid #0A0E12;
            border-radius: 50%;
            box-shadow: 0 0 0 3px #00D9FF;
        }

        .quarter-header h2 {
            color: #00D9FF;
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: 2em;
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }

        .quarter-header .date {
            color: #F5F5F5;
            opacity: 0.5;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .items {
            display: grid;
            gap: 18px;
        }

        .item {
            background: #0A0E12;
            padding: 24px 28px;
            border-radius: 8px;
            border: 1px solid #2D3748;
            border-left: 4px solid #00D9FF;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(0, 217, 255, 0.3), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .item:hover {
            transform: translateX(8px);
            border-color: #00D9FF;
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.15);
        }

        .item:hover::before {
            opacity: 1;
        }

        .item h3 {
            color: #F5F5F5;
            margin-bottom: 10px;
            font-size: 1.3em;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
        }

        .item p {
            color: #F5F5F5;
            opacity: 0.7;
            margin-bottom: 14px;
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: 0.95em;
            line-height: 1.65;
        }

        .status {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 500;
            font-family: 'Roboto Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status.done {
            background: rgba(95, 211, 95, 0.15);
            color: #5FD35F;
            border: 1px solid rgba(95, 211, 95, 0.3);
        }

        .status.in-progress {
            background: rgba(255, 184, 0, 0.15);
            color: #FFB800;
            border: 1px solid rgba(255, 184, 0, 0.3);
        }

        .status.planned {
            background: rgba(0, 217, 255, 0.15);
            color: #00D9FF;
            border: 1px solid rgba(0, 217, 255, 0.3);
        }

        footer {
            text-align: center;
            padding: 60px 20px 40px;
            color: #F5F5F5;
            opacity: 0.5;
            font-size: 0.9em;
            font-family: 'Inter', sans-serif;
            border-top: 1px solid #2D3748;
            margin-top: 60px;
            position: relative;
        }

        footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(to right, transparent, #00D9FF, transparent);
            opacity: 0.4;
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 100px 20px;
            color: #00D9FF;
            font-family: 'Roboto Mono', monospace;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2.5em;
            }

            header p {
                font-size: 1.1em;
            }

            .timeline {
                padding-left: 35px;
            }

            .quarter-header::before {
                left: -43px;
            }

            .version-info {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }

        /* Selection Styling */
        ::selection {
            background-color: rgba(0, 217, 255, 0.3);
            color: #F5F5F5;
        }

        ::-moz-selection {
            background-color: rgba(0, 217, 255, 0.3);
            color: #F5F5F5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="app" class="loading">Loading roadmap</div>
    </div>

    <script>
        const statusLabels = {
            done: '✓ Completed',
            'in-progress': '⚡ In Progress',
            planned: '📋 Planned'
        };

        function renderRoadmap(data) {
            const app = document.getElementById('app');

            let html = `
                <header>
                    <h1>${data.title}</h1>
                    <p>${data.subtitle}</p>
                </header>

                <div class="version-info">
                    <div>
                        <strong>Last Updated:</strong> ${data.last_updated}
                    </div>
                    <div>
                        <a href="${data.github_url}">📜 View GitHub</a>
                    </div>
                </div>

                <div class="timeline">
            `;

            for (const quarter of data.quarters) {
                html += `
                    <div class="quarter">
                        <div class="quarter-header">
                            <h2>${quarter.name}</h2>
                            ${quarter.date ? `<p class="date">${quarter.date}</p>` : ''}
                        </div>
                        <div class="items">
                `;

                for (const item of quarter.items) {
                    const statusClass = item.status.replace('_', '-');
                    html += `
                        <div class="item">
                            ${item.title ? `<h3>${item.title}</h3>` : ''}
                            <p>${item.description}</p>
                            <span class="status ${statusClass}">${statusLabels[statusClass] || item.status}</span>
                        </div>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
            }

            html += `
                </div>

                <footer>
                    <p>This roadmap is a living document and subject to change based on user feedback and development priorities.</p>
                </footer>
            `;

            app.className = '';
            app.innerHTML = html;
        }

        // Fetch and render
        fetch('roadmap.yaml')
            .then(response => response.text())
            .then(yaml => {
                const data = jsyaml.load(yaml);
                renderRoadmap(data);
            })
            .catch(error => {
                document.getElementById('app').innerHTML = `
                    <div style="color: #ff6b6b; text-align: center; padding: 100px 20px;">
                        <h2>Failed to load roadmap</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            });
    </script>
</body>
</html>
