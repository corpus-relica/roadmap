<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RELICA Roadmap</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230A0E12'/><text x='8' y='12' font-size='11' text-anchor='middle' fill='%2300D9FF' font-family='monospace'>R</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        @font-face {
            font-family: 'Departure Mono';
            src: url('DepartureMono-Regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0A0E12;
            --surface: #1A1F26;
            --line: #2D3748;
            --ink: #F5F5F5;
            --cyan: #00D9FF;
            --amber: #FFB800;
            --green: #5FD35F;
        }

        html {
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.55;
            color: var(--ink);
            background: var(--bg);
            overflow-x: hidden;
        }

        /* scanlines — same whisper as the main site */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 217, 255, 0.03) 2px,
                rgba(0, 217, 255, 0.03) 4px
            );
            opacity: 0.4;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 28px 24px 40px;
        }

        /* ── masthead: one slim row, not a hero ─────────────────── */
        header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 10px 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--line);
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--cyan), transparent);
            opacity: 0.35;
        }

        .masthead-title {
            display: flex;
            align-items: baseline;
            gap: 14px;
        }

        header h1 {
            font-family: 'STIX Two Text', Georgia, serif;
            font-size: 1.7em;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--cyan);
            text-shadow: 0 0 24px rgba(0, 217, 255, 0.45);
        }

        header .subtitle {
            font-family: 'Departure Mono', 'Martian Mono', monospace;
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: rgba(245, 245, 245, 0.6);
        }

        .masthead-meta {
            margin-left: auto;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px 20px;
            font-family: 'Martian Mono', monospace;
            font-size: 0.72em;
            color: rgba(245, 245, 245, 0.5);
        }

        .masthead-meta a {
            color: var(--cyan);
            text-decoration: none;
            transition: color 0.2s;
        }

        .masthead-meta a:hover {
            color: var(--amber);
        }

        .masthead-meta a:focus-visible {
            outline: 2px solid rgba(0, 217, 255, 0.7);
            outline-offset: 2px;
            border-radius: 2px;
        }

        /* legend rides in the masthead — statuses need no badge downstream */
        .legend {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 22px;
            padding-top: 10px;
            font-family: 'Departure Mono', 'Martian Mono', monospace;
            font-size: 0.66em;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: rgba(245, 245, 245, 0.45);
        }

        .legend .g { margin-right: 6px; }

        /* ── ledger ─────────────────────────────────────────────── */
        .quarters {
            max-width: 860px;
            margin: 0 auto;
            padding-top: 26px;
        }

        .quarter {
            margin-bottom: 30px;
        }

        .quarter-header {
            display: flex;
            align-items: baseline;
            gap: 14px;
            padding-bottom: 7px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 4px;
        }

        .quarter-header h2 {
            font-family: 'STIX Two Text', Georgia, serif;
            font-size: 1.22em;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--cyan);
        }

        .quarter-header .date {
            margin-left: auto;
            font-family: 'Martian Mono', monospace;
            font-size: 0.68em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(245, 245, 245, 0.5);
            white-space: nowrap;
        }

        .item {
            display: flex;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(45, 55, 72, 0.55);
            transition: background 0.2s;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item:hover {
            background: rgba(0, 217, 255, 0.035);
        }

        .glyph {
            font-family: 'Martian Mono', monospace;
            font-size: 0.8em;
            line-height: 1.9;
            flex: 0 0 14px;
        }

        .glyph.done { color: var(--green); }
        .glyph.in-progress { color: var(--amber); }
        .glyph.planned { color: rgba(0, 217, 255, 0.7); }

        .item .body {
            font-size: 0.87em;
        }

        .item .t {
            font-weight: 600;
            color: var(--ink);
        }

        .item .d {
            color: rgba(245, 245, 245, 0.62);
        }

        /* the one title-less narrative entry reads as prose */
        .item .d.prose {
            font-family: 'STIX Two Text', Georgia, serif;
            font-size: 1.04em;
            color: rgba(245, 245, 245, 0.7);
        }

        /* ── horizon section — softer, less committal ──────────── */
        .quarter.horizon {
            opacity: 0.55;
            transition: opacity 0.3s;
        }

        .quarter.horizon:hover {
            opacity: 0.8;
        }

        .quarter.horizon .quarter-header h2 {
            color: rgba(0, 217, 255, 0.5);
        }

        .quarter.horizon .glyph {
            color: rgba(245, 245, 245, 0.25);
        }

        footer {
            text-align: center;
            padding: 28px 20px 0;
            margin-top: 8px;
            color: rgba(245, 245, 245, 0.45);
            font-size: 0.78em;
            border-top: 1px solid var(--line);
            position: relative;
        }

        footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--cyan), transparent);
            opacity: 0.35;
        }

        .loading {
            text-align: center;
            padding: 100px 20px;
            color: var(--cyan);
            font-family: 'Martian Mono', monospace;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .loading::after { animation: none; }
        }

        @media (max-width: 600px) {
            .masthead-meta {
                margin-left: 0;
            }
        }

        ::selection {
            background-color: rgba(0, 217, 255, 0.3);
            color: var(--ink);
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="app" class="loading">Loading roadmap</div>
    </div>

    <script>
        const statusGlyphs = {
            done: { g: '✓', label: 'shipped' },
            'in-progress': { g: '◆', label: 'in progress' },
            planned: { g: '○', label: 'planned' }
        };

        function renderRoadmap(data) {
            const app = document.getElementById('app');

            let html = `
                <header>
                    <div class="masthead-title">
                        <h1>${data.title}</h1>
                        <span class="subtitle">${data.subtitle}</span>
                    </div>
                    <div class="masthead-meta">
                        <span>updated ${data.last_updated}</span>
                        <a href="${data.github_url}">GitHub ↗</a>
                    </div>
                    <div class="legend">
                        <span><span class="g glyph done">✓</span>shipped</span>
                        <span><span class="g glyph in-progress">◆</span>in progress</span>
                        <span><span class="g glyph planned">○</span>planned</span>
                    </div>
                </header>

                <div class="quarters">
            `;

            for (const quarter of data.quarters) {
                const isHorizon = quarter.type === 'horizon';
                html += `
                    <section class="quarter${isHorizon ? ' horizon' : ''}">
                        <div class="quarter-header">
                            <h2>${quarter.name}</h2>
                            ${quarter.date ? `<span class="date">${quarter.date}</span>` : ''}
                        </div>
                `;

                for (const item of quarter.items) {
                    const statusClass = item.status.replace('_', '-');
                    const glyph = statusGlyphs[statusClass] || { g: '·', label: item.status };
                    html += `
                        <div class="item">
                            <span class="glyph ${statusClass}" title="${glyph.label}" aria-label="${glyph.label}">${glyph.g}</span>
                            <div class="body">
                                ${item.title
                                    ? `<span class="t">${item.title}</span> <span class="d">— ${item.description}</span>`
                                    : `<span class="d prose">${item.description}</span>`}
                            </div>
                        </div>
                    `;
                }

                html += `</section>`;
            }

            html += `
                </div>

                <footer>
                    <p>This roadmap is a living document and subject to change based on user feedback and development priorities.</p>
                </footer>
            `;

            app.className = '';
            app.innerHTML = html;
        }

        fetch('roadmap.yaml')
            .then(response => response.text())
            .then(yaml => {
                const data = jsyaml.load(yaml);
                renderRoadmap(data);
            })
            .catch(error => {
                document.getElementById('app').innerHTML = `
                    <div style="color: #ff6b6b; text-align: center; padding: 100px 20px;">
                        <h2>Failed to load roadmap</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            });
    </script>
</body>
</html>
